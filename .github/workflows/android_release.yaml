name: android_release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.9)，不存在会自动创建'
        required: true
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          key: gradle-cache-${{ hashFiles('starboard/android/apk/**/*gradle*') }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Set up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6

      - name: Set Android env vars
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          PROJECT_NAME=$(gcloud config get-value project)

      - name: Install GN
        run: |
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      - name: GN
        run: |
          gn gen out/android-${{ matrix.arch }}_gold --args='target_platform="android-${{ matrix.arch }}" target_os="android" target_cpu="${{ matrix.arch }}" build_type="gold" sb_api_version=15'
          gn check out/android-${{ matrix.arch }}_gold

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib \
            g++-multilib libc6-dev-i386
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: Ensure Android debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Cobalt
        run: |
          NINJA_STATUS="[%e sec | %f/%t %u remaining | %c/sec | j%r] "
          ninja -C out/android-${{ matrix.arch }}_gold cobalt_install

      # 两个架构产物都叫 cobalt.apk，重命名避免在 Release 里互相覆盖
      - name: Rename APK
        run: cp out/android-${{ matrix.arch }}_gold/cobalt.apk cobalt-android-${{ matrix.arch }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-${{ matrix.arch }}
          path: cobalt-android-${{ matrix.arch }}.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          pattern: cobalt-android-*
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          # tag 不存在时，在触发 workflow 的这个提交上自动创建
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*.apk
